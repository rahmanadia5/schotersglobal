<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Schoters Global Internal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}
:root{
  --bg:#fbfcfe; --surface:#ffffff; --surface-2:#f1f6fc; --line:#e6ebf2;
  --ink:#111827; --muted:#6b7280; --accent:#2f86dc; --accent-soft:#e5f2fd;
  --good:#11805a; --good-soft:#dcf5e9; --warn:#a85d00; --warn-soft:#fdf1dc; --bad:#b4233a; --bad-soft:#fde6ea;
  --rail:#1d6cb8; --rail-grad:linear-gradient(180deg,#2178c9 0%,#1a5fa6 100%); --rail-ink:#e3f0fc; --rail-active:#1a64ad;
  --violet:#7b3aed; --sun:#f7cd5b; --sun-ink:#3d2c00;
  --shadow:0 1px 2px rgba(19,35,58,.04),0 8px 24px rgba(19,35,58,.06);
  --display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.5rem;font-weight:800}h2{font-size:1.05rem;font-weight:700}h3{font-size:.95rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail-grad);color:var(--rail-ink);padding:20px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;color:#fff}
.brand-mark{width:32px;height:32px;border-radius:10px;background:#fff;color:var(--rail-active);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px}
.brand b{font-family:var(--display);font-size:15px;display:block;line-height:1.1}
.brand small{font-size:11px;color:var(--rail-ink)}
.role-tag{margin:0 8px;display:inline-flex;align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--sun);color:var(--sun-ink);padding:3px 9px;border-radius:99px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;line-height:1.25;border-radius:12px;color:var(--rail-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.16);color:#fff}
.nav a[aria-current="page"]{background:#fff;color:var(--rail-active);font-weight:700;box-shadow:0 4px 14px rgba(10,50,100,.18)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .count{margin-left:auto;font-size:11px;background:var(--sun);color:var(--sun-ink);font-weight:700;border-radius:99px;padding:0 7px}
.nav-group{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.7);padding:18px 12px 6px}.nav-group:first-child{padding-top:4px}
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.switch{display:flex;flex-direction:column;gap:6px;padding:0}
.switch label{padding:0 12px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.switch select{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:7px 8px}
.switch option{color:var(--ink)}
.me{display:flex;align-items:center;gap:10px;padding:12px 8px 4px;border-top:1px solid rgba(255,255,255,.12)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ffd9a8,#f7b4c4);color:#5a2a3a;display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none;font-size:13px}
.me-txt{min-width:0;flex:1}.me-txt b{color:#fff;display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me-txt small{color:var(--rail-ink);font-size:12px}
.logout{background:none;border:none;color:var(--rail-ink);cursor:pointer;padding:6px;border-radius:8px;font-size:12px}.logout:hover{background:rgba(255,255,255,.12);color:#fff}
@media (min-width:761px){
  body{background:var(--rail)}
  .shell{background:var(--rail-grad);height:100vh;overflow:hidden}
  .rail{background:transparent}
  .main{margin:10px 10px 10px 0;height:calc(100vh - 20px);overflow-y:auto;border-radius:26px;background:var(--bg)}
}
.main{min-width:0}
.page{padding:28px 32px 48px;display:flex;flex-direction:column;gap:20px;max-width:1240px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph p{color:var(--muted);margin-top:4px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.flush{padding:0;gap:0;overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.flush .panel-h{padding:16px 20px;border-bottom:1px solid var(--line)}
.hint{color:var(--muted);font-size:13px}
.stat{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.stat:hover{border-color:#bcd8f3}
.stat b{font-family:var(--display);font-size:1.7rem;font-weight:800;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}.stat.good b{color:var(--good)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:inherit}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:linear-gradient(135deg,#4fb0f2 0%,#2f86dc 55%,#1f6fc4 100%);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(31,111,196,.25)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.violet{background:linear-gradient(135deg,#9a5cf5 0%,#7b3aed 55%,#6528d6 100%);color:#fff;border-color:transparent}
.btn.danger{color:var(--bad);border-color:#f3c7cf}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.accent{background:var(--accent-soft);color:#1a64ad}.pill.violet{background:#efe7fe;color:var(--violet)}
.pill.silver{background:#eef1f5;color:#475569}.pill.gold{background:#fdf3d3;color:#8a5a00}.pill.platinum{background:#e8eefc;color:#3346a8}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px}
.chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}tr.click:hover td{background:#f7fbff}
.tbl-wrap{overflow-x:auto}
.sub{color:var(--muted);font-size:12.5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);min-width:0}
.toolbar input[type=search]{flex:1;min-width:200px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:600;font-size:13px}
.field textarea{min-height:90px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.err{color:var(--bad);font-size:12.5px;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:6px 12px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .grow{flex:1;min-width:0}
.item .title{font-weight:600}
.item.click{cursor:pointer}.item.click:hover{background:#f7fbff}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13.5px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.big{font-family:var(--display);font-size:2rem;font-weight:800;line-height:1}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.banner.info{background:var(--accent-soft);color:#1a64ad}
.ai-badge{font-size:12px;font-weight:700;color:var(--violet);background:#efe7fe;padding:3px 10px;border-radius:99px}
.report{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(180deg,#f7f2ff,#fff);display:flex;flex-direction:column;gap:8px}
.report textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:70px;background:#fff}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:14px;max-width:85%;font-size:13.5px}
.msg.st{background:var(--surface-2);align-self:flex-start}
.msg.us{background:var(--accent-soft);align-self:flex-end}
.msg.note{background:var(--warn-soft);align-self:stretch;max-width:none;border:1px dashed #e8c98a}
.msg small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:2px;font-weight:600}
.slots{display:grid;grid-template-columns:70px repeat(7,minmax(0,1fr));gap:4px;font-size:12px}
.slots .h{font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.slots .t{color:var(--muted);padding:6px 0}
.slot{border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;padding:6px 0;font-weight:600;color:var(--muted)}
.slot.on{background:var(--accent-soft);border-color:#a9d1f5;color:#1a64ad}
.slot.busy{background:#eef1f5;color:#94a3b8;cursor:not-allowed;text-decoration:line-through}
.slot.booked{background:#efe7fe;border-color:#d4c0fb;color:var(--violet);cursor:default}
.overlay{position:fixed;inset:0;background:rgba(15,30,50,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:20px;max-width:620px;width:100%;max-height:calc(100vh - 32px);overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding-top:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.demo-note{font-size:12px;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.mcard{text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.mcard:hover{border-color:#bcd8f3}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;border-radius:3px}
.mstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mstats div{background:var(--surface-2);border-radius:10px;padding:8px 10px}.mstats b{display:block;font-family:var(--display);font-size:1.15rem}.mstats span{font-size:11.5px;color:var(--muted)}
.m-ico{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700}.mk-video{background:#efe7fe;color:var(--violet)}.mk-doc{background:var(--accent-soft);color:#1a64ad}
.drop{border:2px dashed #bcd8f3;border-radius:16px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:#f7fbff;text-align:center}.drop:hover{background:var(--accent-soft)}
.article-ed{gap:16px}
.art-title{font-family:var(--display);font-size:1.5rem;font-weight:800;border:none;border-bottom:1px solid var(--line);padding:4px 0 10px;background:transparent;width:100%}
.art-title:focus{outline:none;border-bottom-color:var(--accent)}
.art-body{min-height:260px;line-height:1.7;font-size:15px;max-width:72ch;outline:none;border-radius:10px;padding:4px}
.art-body:focus{box-shadow:0 0 0 2px var(--accent-soft)}
.art-body h3{font-size:1.05rem;margin:14px 0 4px}.art-body p{margin:0 0 10px}.art-body ul,.art-body ol{margin:0 0 10px;padding-left:22px}
.art-view{line-height:1.7;font-size:15px;max-width:72ch}.art-view h3{font-size:1.05rem;margin:14px 0 4px}.art-view p{margin:0 0 10px}.art-view ul,.art-view ol{margin:0 0 10px;padding-left:22px}
.vidbox{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#1b4f8a,#2f86dc);color:#fff;border-radius:14px;padding:22px;aspect-ratio:16/6;min-height:120px}.vidbox>span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:20px;flex:none}.vidbox .sub{color:rgba(255,255,255,.8)}
.rail-m{margin:2px 0 8px;position:relative}.rail-m label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.rail-m svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8;pointer-events:none}.rail-m:after{content:'';position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.rail-m select{-webkit-appearance:none;appearance:none;width:100%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:12px;padding:9px 34px 9px 38px;font:600 13.5px/1.2 inherit;cursor:pointer;text-overflow:ellipsis}.rail-m select:hover{background:rgba(255,255,255,.2)}.rail-m option{color:var(--ink)}
.pkgs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pkgc{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.pkgc.silver{background:linear-gradient(180deg,#f6f8fb,#fff)}.pkgc.gold{background:linear-gradient(180deg,#fffaeb,#fff);border-color:#f3e2ad}.pkgc.platinum{background:linear-gradient(180deg,#f0f4ff,#fff);border-color:#d5def8}.pkgc.len{background:var(--surface-2)}
.pkgc h3{font-size:1.05rem;margin:0}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;align-self:flex-start}
.stepper button{border:none;background:none;width:36px;height:40px;font-size:18px;font-weight:700;color:var(--accent);cursor:pointer}.stepper button:hover{background:var(--accent-soft)}
.stepper input{width:58px;border:none;text-align:center;font:700 1.3rem var(--display);padding:0;-moz-appearance:textfield}.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.shift{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid #cfe3f8;background:#f3f9ff;border-radius:14px;padding:10px 14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good,#1a9e5c);display:inline-block}
@media (max-width:1000px){.pkgs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.rail-m{display:none}}
.lenpick{display:flex;gap:6px;flex-wrap:wrap}
.lenbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-weight:600;color:var(--muted);cursor:pointer}
.lenbtn[aria-pressed=true]{background:var(--accent-soft);border-color:#a9d1f5;color:#1a64ad}
/* login: brand panel left, form + demo accounts right */
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.login-side{background:var(--rail-grad);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.login-side .brand{padding:0;color:#fff}.login-side .brand b{font-size:20px}.login-side .brand small{color:var(--rail-ink);font-size:13px}
.login-side .brand-mark{width:40px;height:40px;font-size:18px;border-radius:12px}
.login-side h2{font-size:3rem;line-height:1.05;font-weight:800;max-width:13ch;letter-spacing:-.03em}
.login-right{overflow-y:auto;height:100vh}
.login-form{display:flex;flex-direction:column;gap:16px;padding:64px 32px;max-width:500px;width:100%;margin:0 auto}
.login-form h1{font-size:1.5rem}
.login-form .field input{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);font-size:15px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.lg{padding:12px 20px;font-size:15px;border-radius:12px}
.gbtn{gap:10px}.gbtn svg{width:18px;height:18px}
.demo{border-top:1px solid var(--line);padding-top:22px;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.demo h2{font-size:1.1rem}
.demo-role{margin-top:14px;font-weight:700;color:var(--muted);font-size:13.5px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.demo-desc{font-size:13.5px;color:var(--muted);margin:6px 0 4px}
.acct{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;margin-top:6px}
.acct:hover{border-color:#a9d1f5;background:#f7fbff}
.acct .avatar{background:var(--rail-active);color:#fff;width:36px;height:36px;font-size:12.5px}
.acct b{display:block}.acct span{color:var(--muted);font-size:13px}
@media (max-width:760px){.login{grid-template-columns:minmax(0,1fr);overflow-y:auto}.login-right{height:auto;overflow:visible}.login-side{padding:28px 16px;gap:14px}.login-side h2{font-size:1.7rem}.login-form{padding:28px 16px 40px}}

/* picker + mentor switcher */
.gsi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.gsi:hover,.gsi.act{background:var(--accent-soft)}
.gsi .avatar{width:30px;height:30px;font-size:11px;flex:none}

     <p class="hint">One mentor per student. On a change, reports, documents and the learning plan stay with the student.</p></section>

function stSessions(s){const L=S.sessions.filter(x=>x.st===s.id).sort((a,b)=>a.date<b.date?1:-1);

function stApps(s){const L=S.apps[s.id]||[];

function mStats(m){const n=S.students.filter(s=>s.mentor===m.id&&s.status!=='Ended');const r=openReviews(m.id);return {n,wk:S.sessions.filter(x=>x.m===m.id&&x.state==='upcoming'&&days(x.date)<=7).length+(m.id==='m1'?3:m.id==='m2'?2:1),od:r.filter(x=>x.due<iso(TODAY)).length,rev:r.length,rep:S.sessions.filter(x=>x.m===m.id&&x.state==='report').length};}

/* ---------- Support inbox ---------- */
V.inbox=()=>{if(ROLES[S.role].ch)S.inboxCh=ROLES[S.role].ch;const ch=S.inboxCh;const iq=(S.inboxQ||'').toLowerCase();const L=S.questions.filter(q=>q.ch===ch&&(!iq||(q.q+' '+stu(q.st).name+' '+(q.assignee||'')).toLowerCase().includes(iq))).sort((a,b)=>(a.status==='Open'?0:1)-(b.status==='Open'?0:1)||waitH(b)-waitH(a));
  const sel=S.questions.find(q=>q.id===S.inboxSel)||L[0];
  const cnt=c=>S.questions.filter(q=>q.ch===c&&q.status==='Open').length;
  const target=ch==='sp'?8:4;
  return `<div class="ph"><div><div class="eyebrow">Support inbox</div><h1>${ROLES[S.role].ch==='sp'?'Student Priority questions':ROLES[S.role].ch==='hotline'?'Hotline questions':'Student questions'}</h1><p>Replies go to the student as "our team". ${ROLES[S.role].ch!=='hotline'?'Student Priority '+esc(S.settings.spHours):''}${ROLES[S.role].ch?'':' · '}${ROLES[S.role].ch!=='sp'?'Hotline '+esc(S.settings.hotline):''}</p></div>
   ${ROLES[S.role].ch?'':`<div class="seg" role="group"><button aria-pressed="${ch==='sp'}" data-ch="sp">Student Priority ${cnt('sp')?`(${cnt('sp')})`:''}</button><button aria-pressed="${ch==='hotline'}" data-ch="hotline">Hotline ${cnt('hotline')?`(${cnt('hotline')})`:''}</button></div>`}</div>
  ${ch==='sp'?spShift():''}
  <div class="grid"><section class="panel flush c5"><div class="panel-h" style="padding-bottom:10px"><input type="search" id="iq" placeholder="Search question or student" value="${esc(S.inboxQ||'')}" aria-label="Search questions" style="flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px"></div><div class="list">${L.map(q=>{const w=waitH(q);const s=stu(q.st);return `<div class="item click" data-q="${q.id}" style="${sel&&sel.id===q.id?'background:#f1f7fe':''}"><div class="grow"><div class="title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(q.q)}</div><div class="sub">${esc(s.name)} · ${s.pkg}${q.ch==='sp'?(q.status!=='Open'&&q.assignee?' · replied by '+esc(q.assignee):''):(q.assignee?' · '+esc(q.assignee):'')}</div></div>${q.status==='Open'?`<span class="pill ${w>=target?'bad':'warn'} num">${w} h</span>`:`<span class="pill good">${q.status}</span>`}</div>`;}).join('')||'<div class="empty">No questions.</div>'}</div></section>
  <section class="panel c7">${sel?inboxThread(sel):'<div class="empty">Pick a question.</div>'}</section></div>`;
};
function spShift(){const L=S.settings.spShifts;const now='16:00';const on=L.find(x=>x.from<=now&&now<x.to);
  return `<div class="shift"><span class="dot"></span><b>On shift now: ${on?esc(on.name):'nobody'}</b><span class="sub">${L.map(x=>`${esc(x.name)} ${x.from}–${x.to}`).join(' · ')} (GMT+7, Mon–Fri)</span><span class="sub" style="margin-left:auto">Shift-based: whoever is on shift answers. No assigning.</span></div>`;}
function inboxThread(q){const s=stu(q.st);const m=s.mentor?men(s.mentor):null;
  return `<div class="panel-h"><div><h2>${esc(s.name)}</h2><div class="sub">${s.pkg} · ${left(s)} sessions left · mentor ${m?esc(m.name):'not assigned'} · ends ${fd(s.end)}</div></div>${allowed('student')?`<a class="btn sm" href="#student-${s.id}">Profile</a>`:''}</div>
  <div class="thread"><div class="msg st"><small>${esc(s.name)} · ${q.at.replace('T',' ')} UTC</small>${esc(q.q)}</div>${q.msgs.map(x=>`<div class="msg ${x.note?'note':'us'}"><small>${x.note?'Internal note to '+esc(x.to)+' (student cannot see)':esc(x.by)} · ${x.at.replace('T',' ')}</small>${esc(x.t)}</div>`).join('')}</div>
  ${q.status==='Open'?`<div class="field"><label for="rep">Reply as "our team"</label><textarea id="rep" placeholder="Write a reply in English or Vietnamese"></textarea></div>
  <div class="toolbar"><select id="saved" aria-label="Saved reply"><option value="">Saved replies…</option>${S.saved.map((r,i)=>`<option value="${i}">${esc(r.t)} (EN)</option><option value="${i}v">${esc(r.t)} (VI)</option>`).join('')}</select>
   ${q.ch==='sp'?'':`<select id="asg" aria-label="Assign"><option value="">Assign to…</option>${S.users.filter(u=>u.role===(q.ch==='sp'?'Student Priority':'Hotline')&&u.status==='Active').map(u=>`<option ${q.assignee===u.name?'selected':''}>${esc(u.name)}</option>`).join('')}</select>`}</div>
  <div class="row-btns"><button class="btn primary" data-act="reply" data-id="${q.id}">Send reply</button>${m?`<button class="btn" data-act="askmentor" data-id="${q.id}">Ask the mentor</button>`:''}${S.role==='super'&&q.ch==='hotline'&&/session|mentor/i.test(q.q)?`<button class="btn" data-act="adjust" data-id="${s.id}">Correct balance</button>`:''}</div>
  <p class="hint">The student only ever sees replies from "our team".</p>`:`<div class="banner info">This question is ${q.status.toLowerCase()}.</div>`}`;}

/* ---------- MENTOR ---------- */
function supToday(){const q=(S.todayQ||'').toLowerCase();const NOWT='16:00';
  const all=S.sessions.filter(x=>x.date===iso(TODAY)).sort((a,b)=>a.time<b.time?-1:1);
  const st=x=>{const [a,b]=x.time.split('–');if(x.state==='done')return ['Done','good'];if(x.state==='report')return ['Report pending','warn'];if(a<=NOWT&&NOWT<b)return ['Live now','live'];return a>NOWT?['Upcoming','accent']:['Done','good'];};
  const L=all.filter(x=>(!ME_M()||x.m===ME_M())&&(!q||(men(x.m).name+' '+stu(x.st).name+' '+x.title).toLowerCase().includes(q)));
  const busy=[...new Set(all.map(x=>x.m))];const live=all.filter(x=>st(x)[0]==='Live now').length;const left=all.filter(x=>st(x)[0]==='Upcoming').length;
  return `<div class="ph"><div><div class="eyebrow">Mentor workspace</div><h1>Today's classes</h1><p>Thursday 26 Nov 2026 · ${all.length} sessions across ${busy.length} mentors · now ${NOWT} GMT+7</p></div></div>
  <div class="stats"><div class="stat"><b class="num">${all.length}</b><span>Sessions today</span></div><div class="stat ${live?'good':''}"><b class="num">${live}</b><span>Live now</span></div><div class="stat"><b class="num">${left}</b><span>Still to come</span></div><div class="stat"><b class="num">${S.mentors.length-busy.length}</b><span>Mentors with no class today</span></div></div>
  <section class="panel flush"><div style="padding:14px 20px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)"><input type="search" id="tq" placeholder="Search mentor, student or session" value="${esc(S.todayQ||'')}" aria-label="Search today's classes" style="border:1px solid var(--line);border-radius:10px;padding:8px 10px">
   <div class="rolechips" role="group" aria-label="Filter by mentor"><button data-viewm="all" aria-pressed="${!ME_M()}">All mentors <span class="num">${all.length}</span></button>${S.mentors.map(m=>`<button data-viewm="${m.id}" data-quiet="1" aria-pressed="${ME_M()===m.id}">${esc(m.name)} <span class="num">${all.filter(x=>x.m===m.id).length}</span></button>`).join('')}</div></div>
   <div class="list">${L.map(x=>{const [l,c]=st(x);const m=men(x.m),s=stu(x.st);return `<div class="item tday ${c==='live'?'is-live':''}"><div class="ttime num"><b>${x.time.split('–')[0]}</b><span>${x.time.split('–')[1]}</span></div><div class="avatar" style="width:34px;height:34px;font-size:12px">${ini(m.name)}</div><div class="grow"><div class="title">${esc(m.name)} <span class="sub">with</span> ${esc(s.name)}</div><div class="sub">${esc(x.title)} · ${s.pkg}</div></div><span class="pill ${c==='live'?'good':c}">${c==='live'?'● ':''}${l}</span><button class="btn sm" data-viewm="${m.id}" data-go2="msessions">Open</button></div>`;}).join('')||`<div class="empty">${ME_M()?esc(men(ME_M()).name)+' has no class today.':'No class matches.'}</div>`}</div></section>`;}

V.mday=()=>{if(isSup())return supToday();const mine=S.students.filter(s=>inM(s.mentor)&&s.status!=='Ended');
  const up=S.sessions.filter(x=>inM(x.m)&&x.state==='upcoming').sort((a,b)=>a.date<b.date?-1:1);
  const rep=S.sessions.filter(x=>inM(x.m)&&x.state==='report');const rev=openReviews(ME_M());
  const dl=[];mine.forEach(s=>(S.apps[s.id]||[]).forEach(a=>{const d=days(a[2]);if(d>=0&&d<=45&&a[3]!=='Submitted')dl.push({s,a,d});}));dl.sort((a,b)=>a.d-b.d);
  return `<div class="ph"><div><div class="eyebrow">${isSup()?esc(men(ME_M()).name):'My day'}</div><h1>${isSup()?'Today':'Good afternoon, '+esc(fname(men(ME_M()).name))}</h1><p>Thursday 26 Nov 2026 · ${mine.length} student${mine.length===1?'':'s'}</p></div><div class="row-btns"><span class="chip">${svg('cal')}Google Calendar synced</span></div></div>
  <div class="stats">
   <button class="stat" data-go="msessions"><b class="num">${up.filter(x=>days(x.date)<=7).length}</b><span>Sessions this week</span></button>
   <button class="stat ${rep.length?'warn':'good'}" data-go="msessions"><b class="num">${rep.length}</b><span>Reports to approve</span></button>
   <button class="stat ${rev.some(r=>r.due<iso(TODAY))?'bad':rev.length?'warn':'good'}" data-go="mreview"><b class="num">${rev.length}</b><span>Documents to review</span></button>
   <button class="stat" data-go="mstudents"><b class="num">${mine.length}</b><span>${isSup()?'Mentees':'My students'}</span></button></div>
  <div class="grid">
   <section class="panel flush c7"><div class="panel-h"><h2>Next sessions</h2><a class="btn sm" href="#mavail">Availability</a></div><div class="list">${up.map(x=>`<div class="item"><div style="text-align:center;width:44px"><b class="num" style="font-size:18px;font-family:var(--display)">${D(x.date).getUTCDate()}</b><div class="sub">${MON[D(x.date).getUTCMonth()]}</div></div><div class="grow"><div class="title">${esc(x.title)}</div><div class="sub">${esc(stu(x.st).name)} · ${x.time} GMT+7 · ${x.agenda?'agenda shared':'<b style="color:var(--warn)">no agenda yet</b>'}</div></div><button class="btn sm" data-act="agenda" data-id="${x.id}">Agenda</button>${days(x.date)<=1?`<button class="btn sm primary" data-act="join" data-id="${x.id}">Join</button>`:''}</div>`).join('')||'<div class="empty">No sessions booked.</div>'}</div></section>
   <section class="panel flush c5"><div class="panel-h"><h2>Student deadlines</h2><span class="hint">Next 45 days</span></div><div class="list">${dl.map(o=>`<div class="item click" data-go="student-${o.s.id}"><div class="grow"><div class="title">${esc(o.a[0])}</div><div class="sub">${esc(o.s.name)} · ${o.a[3]}</div></div><span class="pill ${o.d<=14?'bad':'warn'} num">${o.d} days</span></div>`).join('')||'<div class="empty">No deadlines soon.</div>'}</div></section>
  </div>`;
};
V.msessions=()=>{const rep=S.sessions.filter(x=>inM(x.m)&&x.state==='report');const up=S.sessions.filter(x=>inM(x.m)&&x.state==='upcoming').sort((a,b)=>a.date<b.date?-1:1);const done=S.sessions.filter(x=>inM(x.m)&&x.state==='done');
  return `<div class="ph"><div><div class="eyebrow">Sessions & reports</div><h1>${isSup()?'Sessions':'My sessions'}</h1><p>Students pick the date and time; you set the agenda. The AI notetaker drafts the report and you approve it within ${S.settings.reportHrs} hours.</p></div></div>
  <section class="panel flush"><div class="panel-h"><h2>Reports to approve</h2><span class="pill ${rep.length?'warn':'good'}">${rep.length}</span></div><div class="list">${rep.map(x=>`<div class="item"><span class="ai-badge">AI draft</span><div class="grow"><div class="title">${esc(x.title)}</div><div class="sub">${esc(stu(x.st).name)}${withM(x.m)} · ${fd(x.date)} · ${days(x.date)<-1?'<b style="color:var(--bad)">over 24 h</b>':'within 24 h'}</div></div><button class="btn sm primary" data-act="report" data-id="${x.id}">Review and approve</button></div>`).join('')||'<div class="empty">All reports approved.</div>'}</div></section>
  <section class="panel flush"><div class="panel-h"><h2>Upcoming</h2></div><div class="list">${up.map(x=>`<div class="item"><div class="grow"><div class="title">${esc(x.title)}</div><div class="sub">${esc(stu(x.st).name)}${withM(x.m)} · ${fd(x.date)} · ${x.time} GMT+7</div>${x.agenda?`<div class="sub" style="margin-top:4px">Agenda: ${esc(x.agenda)}</div>`:''}</div><button class="btn sm" data-act="agenda" data-id="${x.id}">${x.agenda?'Edit agenda':'Add agenda'}</button>${days(x.date)<=1?`<button class="btn sm" data-act="noshow" data-id="${x.id}">No-show</button><button class="btn sm primary" data-act="join" data-id="${x.id}">Join</button>`:''}</div>`).join('')}</div></section>
  <section class="panel flush"><div class="panel-h"><h2>Approved</h2></div><div class="list">${done.map(x=>`<div class="item"><div class="grow"><div class="title">${esc(x.title)}</div><div class="sub">${esc(stu(x.st).name)}${withM(x.m)} · ${fd(x.date)}</div></div><span class="pill good">Visible to student</span></div>`).join('')||'<div class="empty">None yet.</div>'}</div></section>`;
};
V.mreview=()=>{const L=openReviews(ME_M());const sel=L.find(r=>r.d.id===S.reviewSel)||L[0];
  return `<div class="ph"><div><div class="eyebrow">Document review</div><h1>Review queue</h1><p>Sorted by due date. Return each version within ${S.settings.reviewDays} working days.</p></div></div>
  <div class="grid"><section class="panel flush c5"><div class="list">${L.map(r=>{const od=r.due<iso(TODAY);return `<div class="item click" data-rev="${r.d.id}" style="${sel&&sel.d.id===r.d.id?'background:#f1f7fe':''}"><div class="grow"><div class="title">${esc(r.d.name)} <span class="sub">v${r.v.v}</span></div><div class="sub">${esc(stu(r.d.st).name)}${withM(r.d.m)} · ${esc(r.d.type)}${r.d.appDl?' · app deadline '+fd(r.d.appDl):''}</div></div><span class="pill ${od?'bad':'warn'}">${od?'Overdue':'Due '+fd(r.due).slice(0,-5)}</span></div>`;}).join('')||'<div class="empty">Queue is empty.</div>'}</div></section>
  <section class="panel c7">${sel?reviewPane(sel):'<div class="empty">Nothing to review.</div>'}</section></div>`;

function reviewPane(r){const d=r.d,v=r.v;const prev=d.versions[d.versions.length-2];

  ${prev?`<div class="report" style="background:var(--surface-2)"><h3 style="font-size:13px">Your note on v${prev.v} (${fd(prev.sent)})</h3><p>${esc(prev.note)}</p><button class="btn sm" style="align-self:flex-start" data-act="openfile">Compare v${prev.v} and v${v.v} side by side</button></div>`:'<p class="hint">First version of this document.</p>'}

  <section class="panel flush"><div class="panel-h"><h2>Access by role</h2></div><div class="tbl-wrap"><table><thead><tr><th>Permission</th><th>Super Admin</th><th>Operations</th><th>Mentor</th><th>Student Priority</th><th>Hotline</th></tr></thead><tbody>
  ${ACCESS.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(c=>`<td><span class="pill ${c==='No'?'':c==='Yes'||c==='All'||c==='Edit'?'good':'accent'}">${c}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;};

let LIBS={};
function loadScript(src){if(LIBS[src])return LIBS[src];LIBS[src]=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=()=>{delete LIBS[src];no(new Error('load'))};document.head.appendChild(sc);});return LIBS[src];}
const MAMMOTH='https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js';
const PDFJS='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
const PDFW='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
function cleanHtml(h){const d=document.createElement('div');d.innerHTML=h;d.querySelectorAll('script,style,img').forEach(x=>x.remove());d.querySelectorAll('*').forEach(x=>{[...x.attributes].forEach(a=>{if(a.name!=='href')x.removeAttribute(a.name);});});d.querySelectorAll('h1,h2').forEach(x=>{const n=document.createElement('h3');n.innerHTML=x.innerHTML;x.replaceWith(n);});return d.innerHTML.trim();}
async function convertFile(file){const ext=file.name.toLowerCase().split('.').pop();
  if(ext==='docx'){await loadScript(MAMMOTH);const r=await window.mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});return cleanHtml(r.value);}
  if(ext==='pdf'){await loadScript(PDFJS);const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=PDFW;const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const lines=[];
    for(let n=1;n<=Math.min(pdf.numPages,40);n++){const pg=await pdf.getPage(n);const tc=await pg.getTextContent();let cur=null;
      tc.items.forEach(it=>{if(!it.str&&!it.hasEOL)return;const y=Math.round(it.transform[5]),sz=Math.round(Math.hypot(it.transform[0],it.transform[1])*10)/10;
        if(!cur||Math.abs(y-cur.y)>2){if(cur&&cur.t.trim())lines.push(cur);cur={t:'',y,sz:0,gap:cur?cur.y-y:0};}
        cur.t+=it.str;if(it.str.trim())cur.sz=Math.max(cur.sz,sz);});if(cur&&cur.t.trim())lines.push(cur);}
    const cnt={};lines.forEach(l=>cnt[l.sz]=(cnt[l.sz]||0)+l.t.length);const body=+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||10;
    const gaps=lines.map(l=>l.gap).filter(g=>g>0).sort((a,b)=>a-b);const lh=gaps[Math.floor(gaps.length/3)]||body*1.4;
    let out='',p='',ul=false;const flush=()=>{if(p){out+=`<p>${esc(p)}</p>`;p='';}};const endUl=()=>{if(ul){out+='</ul>';ul=false;}};
    lines.forEach(l=>{const t=l.t.trim();
      if(l.sz>body*1.12){flush();endUl();out+=`<h3>${esc(t)}</h3>`;return;}
      if(/^[•\-–*▪●◦]\s*/.test(t)){flush();if(!ul){out+='<ul>';ul=true;}out+=`<li>${esc(t.replace(/^[•\-–*▪●◦]\s*/,''))}</li>`;return;}
      if(l.gap>lh*1.35||l.gap<0)flush();endUl();p+=(p?' ':'')+t;});
    flush();endUl();return out;}
  throw new Error('type');}
function upTopic(){const v=$('#utopic').value;if(v!=='__new')return S.topics.find(x=>x.id===v);const n=$('#unew').value.trim();if(!n){$('#uprog').hidden=false;$('#uprog').innerHTML='<span class="err">Name the new category first.</span>';$('#unew').focus();$('#ufile').value='';return null;}let t=S.topics.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!t){t={id:'t'+Date.now(),name:n,items:[]};S.topics.push(t);log(null,'Category added','',n,'');}return t;}
async function handleUpload(file){const pr=$('#uprog');pr.hidden=false;const ext=file.name.toLowerCase().split('.').pop();
  const nice=file.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ').replace(/^./,c=>c.toUpperCase());
  if(['mp4','mov','webm','m4v'].includes(ext)||/^video\//.test(file.type)){const tp=upTopic();if(!tp)return;const id='u'+Date.now();tp.items.unshift({id,t:nice,k:'Video',st:'Draft',src:file.name,upd:iso(TODAY),html:'<p>Add a short description for students.</p>'});S.matTopic=tp.id;log(null,'Material uploaded','',`${nice} (${tp.name})`,file.name);close();location.hash='matedit-'+id;toast('Video uploaded. Saved as a draft.');return;}
  if(!['docx','pdf'].includes(ext)){pr.innerHTML='<span class="err">Use a .docx, .pdf or video file.</span>';return;}
  const tp0=upTopic();if(!tp0)return;
  pr.textContent=`Converting ${file.name}…`;let html,ok=true;
  try{html=await convertFile(file);if(!html)throw new Error('empty');}catch(err){ok=false;html=`<p>[Converted text from ${esc(file.name)} appears here.]</p>`;}
  const tp=tp0;let title=file.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ').replace(/^./,c=>c.toUpperCase());{const d=document.createElement('div');d.innerHTML=html;const h=d.firstElementChild;if(h&&h.tagName==='H3'&&h.textContent.trim().length<90){title=h.textContent.trim();h.remove();html=d.innerHTML;}}
  const id='u'+Date.now();tp.items.unshift({id,t:title,k:'Article',st:'Draft',src:file.name,upd:iso(TODAY),html});S.matTopic=tp.id;
  log(null,'Material uploaded','',`${title} (${tp.name})`,file.name);close();location.hash='matedit-'+id;toast(ok?'Converted to an article. Saved as a draft.':'Could not read the file here; a placeholder draft was created.');}
let saveT=null;
function autosave(el){const f=findMat(el.dataset.mat);if(!f)return;const st=$('#savestate');if(st)st.textContent='Saving…';clearTimeout(saveT);
  saveT=setTimeout(()=>{f.i[el.dataset.k]=el.dataset.k==='html'?el.innerHTML:el.value;f.i.upd=iso(TODAY);const n=new Date(Date.now()+7*3600e3);const tm=String(n.getUTCHours()).padStart(2,'0')+':'+String(n.getUTCMinutes()).padStart(2,'0');S.savedAt=S.savedAt||{};S.savedAt[f.i.id]=tm;const s2=$('#savestate');if(s2)s2.textContent=(f.i.st==='Draft'?'Draft saved at ':'Saved at ')+tm;},700);}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-acct],[data-login],[data-go],[data-act],[data-tab],[data-ch],[data-q],[data-rev],[data-slot],[data-topic],[data-len],[data-close],[data-close-bg],[data-tbund],[data-viewm],[data-step],[data-urf]');
  if(!e.target.closest('.pk')){const b=$('#pkpop');if(b)b.hidden=true;}
  if(!t)return;
  if(t.dataset.step){const i=$('#'+t.dataset.step);i.value=Math.max(+i.min||1,(+i.value||0)+ +t.dataset.d);return;}
  if(t.dataset.viewm){S.viewM=t.dataset.viewm==='all'?null:t.dataset.viewm;S.reviewSel=null;close();const to=t.dataset.go2;if(to&&route().v!==to)location.hash=to;else if(MVIEWS.includes(route().v))rerender();else location.hash='mday';if(!t.dataset.quiet&&!to&&S.viewM)toast('Now viewing '+men(S.viewM).name+'\'s workspace.');return;}
  if(t.dataset.urf!==undefined){S.userRole=t.dataset.urf;rerender();return;}
  if(t.hasAttribute('data-close-bg')&&e.target!==t)return;
  if(t.dataset.acct){doLogin(t.dataset.acct);return;}
  if(t.dataset.login){S.role=t.dataset.login;try{sessionStorage.setItem('lms-int-role',S.role)}catch(_){}location.hash=ROLES[S.role].home;render();return;}
  if(t.hasAttribute('data-close')||t.hasAttribute('data-close-bg')){close();return;}
  if(t.dataset.tbund){t.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));return;}
  if(t.dataset.go){if(t.dataset.filter){S.filters=Object.assign({q:'',track:'',pkg:'',mentor:'',status:''},JSON.parse(t.dataset.filter));}else if(t.dataset.go==='students'&&t.classList.contains('stat')){S.filters={q:'',track:'',pkg:'',mentor:'',status:''};}
    if(t.dataset.q){S.inboxSel=t.dataset.q;S.inboxCh=S.questions.find(q=>q.id===t.dataset.q).ch;}
    if(t.dataset.go.startsWith('student-'))S.studentTab='overview';close();location.hash=t.dataset.go;return;}
  if(t.dataset.tab){S.studentTab=t.dataset.tab;rerender();return;}
  if(t.dataset.ch){S.inboxCh=t.dataset.ch;S.inboxSel=null;rerender();return;}
  if(t.dataset.q){S.inboxSel=t.dataset.q;rerender();return;}
  if(t.dataset.rev){S.reviewSel=t.dataset.rev;rerender();return;}
  if(t.dataset.topic){S.matTopic=t.dataset.topic;rerender();return;}
  if(t.dataset.len){const L=S.settings.lengths[t.dataset.len];const n=+t.dataset.n;const i=L.indexOf(n);if(i>=0){if(L.length===1){toast('Keep at least one length.');return;}L.splice(i,1);}else{L.push(n);L.sort();}log(null,'Program lengths changed','',`${t.dataset.len}: ${L.join(', ')} yr`,'Settings');rerender();return;}
  if(t.dataset.slot){const SL=mySlots();SL[t.dataset.slot]=!SL[t.dataset.slot];rerender();return;}
  const id=t.dataset.id;
  switch(t.dataset.act){
    case 'logout':S.role=null;try{sessionStorage.removeItem('lms-int-role')}catch(_){}location.hash='';render();break;
    case 'clearlow':S.filters.low=0;rerender();break;
    case 'csv':toast('CSV export (simulated).');break;
    case 'topup':topupModal(id);break;
    case 'dotopup':{const s=stu(id);const ref=$('#tref').value.trim();if(!ref){$('#terr').hidden=false;return;}const i=+[...layer.querySelectorAll('[data-tbund]')].find(b=>b.getAttribute('aria-pressed')==='true').dataset.tbund;const b=S.settings.topups[i];const before=left(s);s.topups+=b.n;(S.ledgerExtra[id]=S.ledgerExtra[id]||[]).push({d:iso(TODAY),k:'Top-up',n:b.n,why:'Payment ref '+ref,by:meName()});log(id,'Top-up recorded','Balance '+before,`Balance ${left(s)} (+${b.n})`,'Payment ref '+ref);close();rerender();toast(`+${b.n} sessions added for ${s.name}.`);break;}
    case 'adjust':adjustModal(id);break;
    case 'doadjust':{const s=stu(id);const n=+$('#adn').value;if(left(s)+n<0){toast('Balance cannot go below 0.');return;}const why=$('#adr').value+($('#adn2').value?': '+$('#adn2').value:'');const before=left(s);s.adj+=n;(S.ledgerExtra[id]=S.ledgerExtra[id]||[]).push({d:iso(TODAY),k:'Adjustment',n,why,by:meName()});log(id,'Balance adjusted','Balance '+before,'Balance '+left(s),why);close();rerender();toast('Balance corrected and logged.');break;}
    case 'assign':assignModal(id);break;
    case 'doassign':{const s=stu(id);const p=layer.querySelector('input[name=mpick]:checked:not([disabled])');const er=$('#merr');if(!p){er.textContent='Pick a mentor.';er.hidden=false;return;}const why=$('#mwhy')?$('#mwhy').value.trim():'First assignment';if(!why){er.textContent='Add a reason for the change.';er.hidden=false;return;}const old=s.mentor?men(s.mentor).name:'';s.mentor=p.value;if(old){S.sessions.filter(x=>x.st===id&&x.state==='upcoming').forEach(x=>x.m=p.value);}log(id,old?'Mentor changed':'Mentor assigned',old,men(p.value).name,why);close();rerender();toast(`${men(p.value).name} is now ${s.name}'s mentor. The student is notified.`);break;}
    case 'editprog':progModal(id);break;
    case 'doprog':{const s=stu(id);const a=$('#pa').value,why=$('#pwhy').value.trim();if(!why){$('#perr').hidden=false;return;}
      if(a==='up'){const np=$('#pv-up').value;if(!S.settings.packages[np]||S.settings.packages[np]<=S.settings.packages[s.pkg]){toast('No higher package.');return;}const add=S.settings.packages[np]-S.settings.packages[s.pkg];log(id,'Package upgraded',s.pkg,`${np} (+${add} sessions)`,why);(S.ledgerExtra[id]=S.ledgerExtra[id]||[]).push({d:iso(TODAY),k:'Upgrade',n:0,why:`${s.pkg} → ${np}, +${add} in package total`,by:meName()});s.pkg=np;}
      else if(a==='ext'){const v=$('#pv-ext').value;log(id,'Program end changed',fd(s.end),fd(v),why);s.end=v;}
      else {log(id,'Program ended early',fd(s.end),fd(iso(TODAY)),why);s.end=iso(TODAY);s.status='Ended';}
      close();rerender();toast('Saved. The student sees the change right away.');break;}
    case 'newstudent':newStudentModal();break;
    case 'reply':{const q=S.questions.find(x=>x.id===id);const txt=$('#rep').value.trim();if(!txt){toast('Write a reply first.');return;}q.msgs.push({by:'Our team ('+meName()+')',t:txt,at:'2026-11-26T05:02'});q.status='Answered';q.assignee=q.assignee||meName();rerender();toast('Reply sent to the student.');break;}
    case 'askmentor':{const q=S.questions.find(x=>x.id===id);const s=stu(q.st);q.msgs.push({note:1,to:men(s.mentor).name,t:'Can you advise on this? I will reply to the student.',at:'2026-11-26T05:02'});rerender();toast('Internal note sent to the mentor.');break;}
    case 'agenda':agendaModal(id);break;
    case 'saveagenda':{const x=S.sessions.find(y=>y.id===id);x.agenda=$('#ag').value.trim();close();rerender();toast('Agenda shared with the student.');break;}
    case 'join':toast('Opens the video call with the AI notetaker (simulated).');break;
    case 'noshow':{const x=S.sessions.find(y=>y.id===id);modal(`<h2>Who did not join?</h2><p class="hint">${esc(x.title)} · ${esc(stu(x.st).name)}</p><div class="list" style="border:1px solid var(--line);border-radius:14px"><div class="item"><div class="grow"><div class="title">Student no-show</div><div class="sub">The session is used</div></div><button class="btn sm" data-act="dons" data-id="${id}" data-who="st">Confirm</button></div><div class="item"><div class="grow"><div class="title">Mentor no-show</div><div class="sub">The session is returned and Ops is alerted</div></div><button class="btn sm" data-act="dons" data-id="${id}" data-who="m">Confirm</button></div></div><div class="modal-foot"><span></span><button class="btn" data-close>Cancel</button></div>`);break;}
    case 'dons':{const x=S.sessions.find(y=>y.id===id);const s=stu(x.st);s.booked--;if(t.dataset.who==='st'){s.used++;s.noshow++;log(x.st,'Student no-show','',x.title,'Marked by mentor');}else{log(x.st,'Mentor no-show','','Session returned: '+x.title,'Marked by mentor');}x.state='gone';S.sessions=S.sessions.filter(y=>y!==x);close();rerender();toast('Recorded.');break;}
    case 'report':reportModal(id);break;
    case 'vi':toast('Vietnamese version of the AI notes (simulated).');break;
    case 'approve':{const x=S.sessions.find(y=>y.id===id);x.state='done';close();rerender();toast('Report approved. The student can see it now.');break;}
    case 'openfile':toast('Opens the document viewer (simulated).');break;
    case 'return':case 'final':{const d=S.docs.find(y=>y.id===id);const note=$('#rnote').value.trim();if(!note){toast('Add a note for the student first.');$('#rnote').focus();return;}const v=d.versions[d.versions.length-1];v.status=t.dataset.act==='final'?'Final':'Returned';v.note=note;S.reviewSel=null;log(d.st,t.dataset.act==='final'?'Document approved as final':'Document returned','',`${d.name} v${v.v}`,'Review');rerender();toast(t.dataset.act==='final'?'Approved as final.':`v${v.v} returned. The student can send v${v.v+1}.`);break;}
    case 'gcal':S.gcal=!S.gcal;rerender();toast(S.gcal?'Google Calendar connected.':'Disconnected. Busy times are no longer blocked.');break;
    case 'dayoff':{S.offs=S.offs||['2026-12-31','2027-01-01'];const v=$('#dayoff').value;if(v&&!S.offs.includes(v))S.offs.push(v);S.offs.sort();rerender();toast('Day off added. Those slots are closed.');break;}
    case 'adduser':userModal(false);break;
    case 'reqmentor':userModal(true);break;
    case 'douser':{const n=$('#un').value.trim(),em=$('#ue').value.trim();if(!n||!em){$('#uerr').hidden=false;return;}const req=!!t.dataset.req&&S.role!=='super';const role=$('#ur').value;if(!req&&role==='Mentor'&&!S.mentors.some(m=>m.name===n))S.mentors.push({id:'m'+(S.mentors.length+1),name:n,spec:($('#unote').value||'New mentor').split(',')[0].split('.')[0],countries:'To complete',langs:'Vietnamese, English',cap:10,since:'2026',edu:'To complete',bio:$('#unote').value||'Profile to complete.',rating:'new',month:0});S.users.push({name:n,email:em,role,status:req?'Pending':'Active',by:meName(),on:iso(TODAY),note:$('#unote').value.trim()});log(null,req?'User requested':'User added','',`${n} (${role})`,req?'Waiting for Super Admin':'Added by Super Admin');close();rerender();toast(req?'Sent to Super Admin for approval.':'Account created and invite sent.');break;}
    case 'approveuser':{const u=S.users[+t.dataset.i];u.status='Active';if(u.role==='Mentor'&&!S.mentors.some(m=>m.name===u.name))S.mentors.push({id:'m'+(S.mentors.length+1),name:u.name,spec:(u.note||'New mentor').split(',')[0].split('.')[0],countries:'To complete',langs:'Vietnamese, English',cap:10,since:'2026',edu:'To complete',bio:u.note||'Profile to complete.',rating:'new',month:0});log(null,'User approved','Pending',`${u.name} (${u.role})`,'Super Admin approval');rerender();toast(`${u.name} approved. Invite sent.`);break;}
    case 'rejectuser':{const u=S.users[+t.dataset.i];u.status='Rejected';log(null,'User rejected','Pending',`${u.name} (${u.role})`,'Super Admin');rerender();toast('Request rejected. The requester is notified.');break;}
    case 'toggleuser':{const u=S.users[+t.dataset.i];u.status=u.status==='Active'?'Deactivated':'Active';log(null,u.status==='Active'?'User reactivated':'User deactivated','',u.name,'Super Admin');rerender();toast(u.status==='Active'?'Reactivated.':`${u.name} lost access right away.`);break;}
    case 'mprofile':if(isSup()){S.viewM=id;drawRail(route().v);}mentorModal(id);break;
    case 'pkopen':{const p=$('#pkpop');p.hidden=!p.hidden;if(!p.hidden){pkDraw();$('#pkq').focus();}break;}
    case 'upload':uploadModal();break;
    case 'pubask':pubModal(id);break;
    case 'dopub':{const {i}=findMat(id);const ed=document.querySelector('.art-body');if(ed&&ed.dataset.mat===id){clearTimeout(saveT);i.html=ed.innerHTML;const ti=document.querySelector('.art-title');if(ti)i.t=ti.value;}i.st=i.st==='Published'?'Draft':'Published';i.upd=iso(TODAY);log(null,i.st==='Published'?'Material published':'Material unpublished','',i.t,'');close();rerender();toast(i.st==='Published'?'Published. Students can see it now.':'Unpublished. Students no longer see it.');break;}
    case 'savesettings':{document.querySelectorAll('[data-pkg]').forEach(i=>S.settings.packages[i.dataset.pkg]=Math.max(1,+i.value||1));document.querySelectorAll('[data-shift]').forEach(i=>S.settings.spShifts[+i.dataset.shift][i.dataset.k]=i.value);document.querySelectorAll('[data-topup]').forEach(i=>S.settings.topups[+i.dataset.topup].price=+i.value||0);document.querySelectorAll('[data-set]').forEach(i=>{const k=i.dataset.set;S.settings[k]=i.type==='number'?+i.value:i.value;});log(null,'Settings changed','','Packages, top-ups and rules','Super Admin');rerender();toast('Saved. Package changes apply to new students only.');break;}
  }
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset&&t.dataset.mat){autosave(t);return;}
  if(t.id==='fq'){S.filters.q=t.value;const pos=t.selectionStart;rerender();const n=$('#fq');n.focus();n.setSelectionRange(pos,pos);}
  if(t.id==='pkq'){pkDraw();return;}
  for(const [id,key] of [['uq','userQ'],['mlq','mlQ'],['iq','inboxQ'],['tq','todayQ']])if(t.id===id){S[key]=t.value;const pos=t.selectionStart;rerender();const n=$('#'+id);n.focus();n.setSelectionRange(pos,pos);return;}
  if(t.id==='aq'){S.auditQ=t.value;const pos=t.selectionStart;rerender();const n=$('#aq');n.focus();n.setSelectionRange(pos,pos);}
  if(t.closest&&t.closest('#nf')&&t.name&&t.tagName==='INPUT'&&t.type!=='date'){NF[t.name]=t.value;}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='roleSel'){S.role=t.value;try{sessionStorage.setItem('lms-int-role',S.role)}catch(_){}location.hash=ROLES[S.role].home;render();return;}
  if(t.dataset.f){S.filters[t.dataset.f]=t.value;rerender();return;}
  if(t.id==='railM'){S.viewM=t.value==='all'?null:t.value;S.reviewSel=null;if(MVIEWS.includes(route().v))rerender();else location.hash='mday';return;}
  if(t.closest&&t.closest('#nf')&&t.name){NF[t.name]=t.name==='len'?+t.value:t.value;if(t.name==='track'){NF.len=lengthOptions(t.value,+NF.grade)[0];}if(t.name==='grade'){NF.grad=(2026+13-(+t.value))+'-06-30';NF.len=Math.max(...lengthOptions('S1',+t.value));}if(t.tagName==='SELECT'||t.type==='date')nsRedraw();return;}
  if(t.id==='saved'&&t.value!==''){const v=t.value;const r=S.saved[parseInt(v)];$('#rep').value=v.endsWith('v')?r.vi:r.en;return;}
  if(t.id==='asg'&&t.value){const q=S.questions.find(x=>x.id===(S.inboxSel||S.questions.filter(y=>y.ch===S.inboxCh)[0].id));q.assignee=t.value;rerender();toast('Assigned to '+t.value+'.');return;}
  if(t.id==='utopic'){$('#unewwrap').hidden=t.value!=='__new';if(t.value==='__new')$('#unew').focus();return;}
  if(t.id==='ufile'&&t.files[0]){handleUpload(t.files[0]);return;}
  if(t.dataset.mattopic){const f=findMat(t.dataset.mattopic);const nt=S.topics.find(x=>x.id===t.value);f.t.items=f.t.items.filter(x=>x!==f.i);nt.items.unshift(f.i);S.matTopic=nt.id;toast('Moved to '+nt.name+'.');return;}
  if(t.id==='pa'){$('#pv-up').hidden=t.value!=='up';$('#pv-ext').hidden=t.value!=='ext';return;}
  if(t.dataset.urole){const u=S.users[+t.dataset.urole];const o=u.role;u.role=t.value;log(null,'Role changed',`${u.name}: ${o}`,t.value,'Super Admin');toast(`${u.name} is now ${t.value}.`);return;}
});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();const em=$('#lemail').value.trim().toLowerCase(),pw=$('#lpass').value;const a=ACCTS.find(x=>x[2]===em);const er=$('#lerr');if(!a||pw!=='demo123'){er.textContent=a?'Wrong password. For the demo accounts it is demo123.':'No staff account with this email. Pick a demo account below.';er.hidden=false;return;}doLogin(a[0]);return;}if(e.target.id!=='nf')return;e.preventDefault();const f=NF;const er=$('#nf-err');
  const fdat=new FormData(e.target);for(const [k,v] of fdat.entries())NF[k]=k==='len'?+v:v;
  if(!f.name.trim()||!/^\S+@\S+\.\S+$/.test(f.email)){er.textContent='Add the student\'s name and a valid email.';er.hidden=false;return;}
  if(f.track==='S1'&&f.grad<=f.start){er.textContent='The graduation date must be after the start date.';er.hidden=false;return;}
  if(S.students.some(s=>s.email.toLowerCase()===f.email.toLowerCase())){er.textContent='A student with this email already exists.';er.hidden=false;return;}
  const len=+f.len||lengthOptions(f.track,+f.grade)[0];const end=calcEnd(f.track,+f.grade,len,f.start,f.track==='S1'?f.grad:null);
  const id='s'+(S.students.length+1+Math.floor(Math.random()*1000));
  S.students.push({id,name:f.name.trim(),email:f.email.trim(),phone:f.phone||'–',school:f.school||'–',track:f.track,grade:f.track==='S1'?+f.grade:null,len,pkg:f.pkg,start:f.start,grad:f.track==='S1'?f.grad:null,end,mentor:f.mentor||null,status:'Active',topups:0,used:0,booked:0,noshow:0,adj:0,intake:String(D(end).getUTCFullYear())});
  log(id,'Student created','',`${f.track}${f.track==='S1'?', grade '+f.grade:''}, ${len} yr, ${f.pkg}, ends ${fd(end)}`,f.contract?'Contract '+f.contract:'Contract');
  if(f.mentor)log(id,'Mentor assigned','',men(f.mentor).name,'At setup');
  Object.assign(NF,{name:'',email:'',phone:'',school:'',contract:'',mentor:''});
  close();S.studentTab='overview';location.hash='student-'+id;toast('Student created. Login email sent.');
});
document.addEventListener('keydown',e=>{
  const box=e.target.id==='pkq'?$('#pklist'):null;
  if(box&&(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter')){const it=[...box.querySelectorAll('.gsi')];if(!it.length)return;let i=it.findIndex(x=>x.classList.contains('kb'));
    if(e.key==='Enter'){e.preventDefault();(it[i]||it[0]).click();return;}
    e.preventDefault();it.forEach(x=>x.classList.remove('kb','act'));i=e.key==='ArrowDown'?(i+1)%it.length:(i<=0?it.length-1:i-1);it[i].classList.add('kb','act');it[i].scrollIntoView({block:'nearest'});return;}
  if(e.key==='Escape'){const p=$('#pkpop');if(p&&!p.hidden){p.hidden=true;return;}close();}});
window.addEventListener('hashchange',()=>{render();const m=$('#main');if(m)m.scrollTop=0;window.scrollTo(0,0);});
try{S.role=sessionStorage.getItem('lms-int-role')||null;}catch(_){}
if(S.role&&!ROLES[S.role])S.role=null;
render();
})();
</script>
